<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Member Sign In | Inner Cirql Coaching</title>
<link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;--offwhite:#faf8f4;--ink:#1a1a1a;
    --ink-60:rgba(26,26,26,0.60);--ink-40:rgba(26,26,26,0.40);--ink-12:rgba(26,26,26,0.12);--ink-08:rgba(26,26,26,0.08);
    --gold:#c9a96e;--gold-soft:rgba(201,169,110,0.14);--gold-deep:#a8874e;--red:#c0603f;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--offwhite);color:var(--ink);}
  body{font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;}
  .bg{position:fixed;inset:0;z-index:0;background:
     radial-gradient(1100px 520px at 50% -8%,rgba(201,169,110,0.10),transparent 60%),
     radial-gradient(900px 500px at 50% 118%,rgba(201,169,110,0.07),transparent 60%);pointer-events:none;}
  .card{position:relative;z-index:1;width:100%;max-width:412px;background:var(--bg);border:1px solid var(--ink-08);border-radius:22px;
     box-shadow:0 1px 2px rgba(26,26,26,0.04),0 30px 60px -28px rgba(26,26,26,0.28);padding:40px 36px 32px;}
  .cobrand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px;}
  .cobrand svg.sig{width:46px;height:46px;margin-bottom:14px;}
  .hname{font-weight:700;font-size:19px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink);}
  .hcoach{font-weight:600;font-size:9.5px;letter-spacing:0.34em;padding-left:0.34em;text-transform:uppercase;color:var(--gold);margin-top:5px;}
  .divider{width:34px;height:1px;background:var(--ink-12);margin:16px auto 0;}
  .lead{text-align:center;margin-bottom:24px;}
  .eyebrow{color:var(--gold);font-weight:700;letter-spacing:0.22em;text-transform:uppercase;font-size:10px;margin-bottom:9px;}
  .lead h1{font-size:23px;font-weight:700;letter-spacing:-0.02em;}
  .lead p{font-size:13px;color:var(--ink-60);margin-top:7px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:6px;}
  .field input{width:100%;border:1px solid var(--ink-12);border-radius:10px;padding:13px 13px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s;}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
  .submit{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;margin-top:6px;padding:14px 18px;background:var(--ink);color:#fff;border:0;border-radius:11px;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;font-family:inherit;transition:background .18s,transform .15s;}
  .submit:hover{background:var(--gold);transform:translateY(-1px);}
  .submit:disabled{opacity:0.6;cursor:default;transform:none;background:var(--ink);}
  .submit svg{width:14px;height:14px;}
  .err{display:none;margin-top:14px;background:rgba(192,96,63,0.10);border:1px solid rgba(192,96,63,0.35);color:var(--red);border-radius:10px;padding:11px 13px;font-size:12.5px;font-weight:600;text-align:center;}
  .err.show{display:block;}
  .forgot{text-align:center;margin-top:16px;font-size:12.5px;}
  .forgot a{color:var(--gold-deep);font-weight:600;text-decoration:none;}
  .forgot a:hover{text-decoration:underline;}
  .foot{margin-top:18px;padding-top:18px;border-top:1px solid var(--ink-08);text-align:center;font-size:11.5px;color:var(--ink-40);line-height:1.55;}
  .lock{display:inline-flex;align-items:center;gap:6px;color:var(--ink-40);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;margin-top:16px;justify-content:center;width:100%;}
  .lock svg{width:12px;height:12px;color:var(--gold);}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="cobrand">
    <svg class="sig" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M 33.34 15.85 A 38 38 0 0 0 33.34 84.15" stroke="#c9a96e" stroke-width="6" stroke-linecap="round"/>
      <path d="M 41.58 29.67 A 22 22 0 0 0 41.58 70.33" stroke="#c9a96e" stroke-width="6" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="6" fill="#c9a96e"/>
      <path d="M 58.42 29.67 A 22 22 0 0 1 58.42 70.33" stroke="#c9a96e" stroke-width="6" stroke-linecap="round"/>
      <path d="M 66.66 15.85 A 38 38 0 0 1 66.66 84.15" stroke="#c9a96e" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div class="hname">Inner Cirql</div>
    <div class="hcoach">Coaching</div>
    <div class="divider"></div>
  </div>

  <div class="lead">
    <div class="eyebrow">Members Portal</div>
    <h1>Sign in</h1>
    <p>Enter the email and password set up during your onboarding.</p>
  </div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@yourbrokerage.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
    </div>
    <button class="submit" id="submitBtn" type="submit">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
      Sign In
    </button>
    <div class="err" id="err"></div>
  </form>

  <div class="forgot"><a href="/forgot/">Forgot your password?</a></div>
  <div class="foot">Access is set up by your coach during onboarding.<br>Trouble signing in? Reach out to Tyler.</div>
  <div class="lock"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/></svg> Private &middot; Members Only</div>
</div>

<script>
(function(){
  // safe same-origin next path
  var raw = new URLSearchParams(location.search).get('next') || '/';
  var next = (raw.charAt(0)==='/' && raw.charAt(1)!=='/') ? raw : '/';

  // if already signed in, skip the form
  fetch('/.netlify/functions/me',{credentials:'same-origin'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){ if(d&&d.authenticated) location.replace(next); });

  var form=document.getElementById('loginForm');
  var btn=document.getElementById('submitBtn');
  var err=document.getElementById('err');
  function showErr(m){ err.textContent=m; err.classList.add('show'); }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    err.classList.remove('show');
    var email=document.getElementById('email').value.trim();
    var password=document.getElementById('password').value;
    if(!email||!password){ showErr('Enter your email and password.'); return; }
    btn.disabled=true; btn.textContent='Signing in…';
    fetch('/.netlify/functions/login',{
      method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({email:email,password:password})
    })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){
      if(!res.ok) throw new Error(res.d && res.d.error ? res.d.error : 'Sign in failed.');
      location.href=next;
    })
    .catch(function(ex){
      showErr(ex.message || 'Something went wrong. Try again.');
      btn.disabled=false;
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg> Sign In';
    });
  });
})();
</script>
</body>
</html>
