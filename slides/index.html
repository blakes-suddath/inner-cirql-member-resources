<!-- DOWNLOAD MODAL (Netlify form: slide-download) -->
<div class="dlm-overlay" id="dlm-overlay" role="dialog" aria-modal="true" aria-labelledby="dlm-title">
  <div class="dlm" id="dlm">
    <button class="dlm-close" type="button" id="dlm-close" aria-label="Close">&#215;</button>
    <div class="dlm-eyebrow">Member Download</div>
    <h3 id="dlm-title">Download the deck.</h3>
    <p class="dlm-deckname" id="dlm-deckname"></p>
    <form id='dlm-form' method='POST' name='slide-download'>
      <input type="hidden" name="form-name" value="slide-download">
      <input type="hidden" name="deck" id="dlm-deck-field" value="">
      <p style="display:none;"><label>Do not fill this out: <input name="bot-field"></label></p>
      <label for="dlm-name">Your name</label>
      <input type="text" id="dlm-name" name="name" required autocomplete="name">
      <label for="dlm-email">Email</label>
      <input type="email" id="dlm-email" name="email" required autocomplete="email">
      <button class="dlm-submit" type="submit"><svg><use href="#i-dl"/></svg><span>Download PDF</span></button>
      <p class="dlm-note">The PDF saves straight to your downloads.</p>
    </form>
    <div class="dlm-done">
      <div class="big">Downloading.</div>
      <p>Your PDF is on its way. See you on Wednesday.</p>
    </div>
  </div>
</div>

<script>
(function(){
  var overlay=document.getElementById('dlm-overlay'), box=document.getElementById('dlm');
  var deckField=document.getElementById('dlm-deck-field'), deckName=document.getElementById('dlm-deckname');
  var form=document.getElementById('dlm-form');
  var currentPdf='';
  function open(pdf,deck){
    currentPdf=pdf; deckField.value=deck; deckName.textContent=deck;
    box.classList.remove('done'); overlay.classList.add('open');
    setTimeout(function(){ document.getElementById('dlm-name').focus(); },50);
  }
  function close(){ overlay.classList.remove('open'); }
  document.addEventListener('lib:pdf',function(e){ open(e.detail.pdf, e.detail.deck); });
  document.getElementById('dlm-close').addEventListener('click',close);
  overlay.addEventListener('click',function(e){ if(e.target===overlay) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  function triggerDownload(){
    var a=document.createElement('a');
    a.href=currentPdf; a.download=currentPdf.split('/').pop();
    document.body.appendChild(a); a.click(); a.remove();
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var data=new URLSearchParams(new FormData(form)).toString();
    fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data})
      .catch(function(){})
      .finally(function(){
        box.classList.add('done');
        triggerDownload();
        setTimeout(close,2200);
        form.reset();
      });
  });
})();
</script>
